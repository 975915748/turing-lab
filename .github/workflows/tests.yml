name: Tests

on:
  push:
    branches:
      - main
      - "codex/**"
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_CHANNEL: default
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Set up Node.js for browser acceptance tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python and browser-test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Check JavaScript syntax
        run: |
          node --check static/app.js
          node --check tests/uid_ui.cjs
          node --check tests/host_ui.cjs
          node --check tests/model_config_ui.cjs
          node --check tests/social_points_ui.cjs
          node --check tests/community_features_ui.cjs
          node --check tests/room_delete_ui.cjs
          node tests/community_features_ui.cjs
          node --check tests/model_operations_ui.cjs
      - name: Run regression tests
        run: python -m pytest -q
      - name: Build production Docker image
        run: docker build --pull -t turing-lab:ci .
      - name: Verify runtime imports inside Docker image
        run: |
          docker run --rm --entrypoint python turing-lab:ci -c "import app, model_api, railway_start; print('Docker runtime imports passed')"
      - name: Upload browser acceptance screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-operations-and-human-judge-browser-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
