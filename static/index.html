<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="light dark"/>
  <title>图灵实验室 · 多人在线主持台</title>
  <link rel="stylesheet" href="/static/style.css?v=1.9.0"/>
  <script defer src="/static/app.js?v=1.9.0"></script>
</head>
<body data-theme="light">
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-icon">T<span class="brand-dot">·</span></span><span><strong>图灵实验室</strong><small>MULTIPLAYER HOST CONSOLE</small></span></div>
      <div class="toolbar"><span id="connection" class="connection">● 未连接</span>
        <label class="mini-label" for="fontSize">字号</label><input aria-label="界面字号" id="fontSize" type="range" min="12" max="22" value="15"/><span id="fontValue">15</span>
        <button id="themeBtn" class="icon-button" title="切换日间/深色主题">☾ 主题</button>
        <button id="logoutBtn" class="ghost hide">退出登录</button>
      </div>
    </header>
    <main id="app" aria-live="polite"><div class="loading">正在连接主持台…</div></main>
    <footer class="footer">OpenAI 兼容模型 API · 匿名裁判 · 全员提交后揭晓</footer>
  </div>
  <dialog id="judgeNotice" aria-labelledby="judgeNoticeTitle" class="judge-modal"><h2 id="judgeNoticeTitle">本轮回答已全部提交</h2><p id="judgeNoticeText">可以查看参赛者匿名回复。</p><button id="judgeNoticeClose" class="primary" type="button">查看本轮回答</button></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
